name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu runners ship the Android SDK preinstalled (ANDROID_HOME);
      # AGP auto-provisions the platform/build-tools it needs.

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Fetch prebuilt TDLib (libtdjson.so) into jniLibs
        run: |
          set -e
          mkdir -p app/src/main/jniLibs
          for i in 1 2 3; do
            curl -fSL "https://github.com/up9cloud/android-libtdjson/releases/download/v1.8.65/jniLibs.tar.gz" -o jniLibs.tar.gz && break
            echo "retry $i"; sleep 5
          done
          tar xzf jniLibs.tar.gz --strip-components=1 -C app/src/main/jniLibs
          echo "=== jniLibs tree ==="
          find app/src/main/jniLibs -maxdepth 2 -type f | sort

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tgwatch-apk
          path: app/build/outputs/apk/debug/*.apk
