name: Android Build

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Fetch prebuilt TDLib (libtdjson.so) into jniLibs
        run: |
          set -e
          mkdir -p app/src/main/jniLibs
          for i in 1 2 3; do
            curl -fSL "https://github.com/up9cloud/android-libtdjson/releases/download/v1.8.65/jniLibs.tar.gz" -o jniLibs.tar.gz && break
            echo "retry $i"; sleep 5
          done
          tar xzf jniLibs.tar.gz --strip-components=1 -C app/src/main/jniLibs

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/tgwatch-${GITHUB_REF_NAME}.apk" 2>/dev/null \
            || cp app/build/outputs/apk/release/app-release.apk "out/tgwatch.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgwatch-apk
          path: out/*.apk

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
