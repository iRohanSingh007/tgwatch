name: EAS Build APK

# Triggers an Android APK build on Expo's EAS cloud (no local Android SDK).
# Requires repo secret EXPO_TOKEN (Expo access token).
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Build Android APK (preview profile)
        run: eas build --platform android --profile preview --non-interactive --wait
